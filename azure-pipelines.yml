trigger:
  - main

pool:
  name: Default

steps:
  - task: CmdLine@2
    displayName: "Build Docker image"
    inputs:
      script: |
        docker build -t demo-app:latest .
        docker image inspect demo-app:latest

  - task: CmdLine@2
    displayName: "Validate Kubernetes configuration"
    inputs:
      script: |
        set KUBECONFIG=C:\azagent\.kube\config
        kubectl version --client
        kubectl config get-contexts
        kubectl get nodes
        kubectl apply --dry-run=client -f k8s\deployment.yaml
        kubectl apply --dry-run=client -f k8s\service.yaml

  - task: CmdLine@2
    displayName: "Deploy to Kubernetes"
    inputs:
      script: |
        set KUBECONFIG=C:\azagent\.kube\config
        kubectl apply -f k8s\deployment.yaml
        kubectl apply -f k8s\service.yaml
        kubectl rollout status deployment/demo-app --timeout=120s
        kubectl get pods
        kubectl get service demo-service
