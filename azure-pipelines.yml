trigger:
- main

pool:
  name: Default   # senin self-hosted agent pool adın neyse o

steps:
# 1️⃣ Debug: kubeconfig gerçekten okunuyor mu?
- task: CmdLine@2
  displayName: "Kubernetes Context Kontrol"
  inputs:
    script: |
      echo KUBECONFIG ayarlaniyor
      set KUBECONFIG=C:\azagent\.kube\config
      kubectl version --client
      kubectl config get-contexts
      kubectl get nodes

# 2️⃣ Deployment
- task: CmdLine@2
  displayName: "Kubernetes Deploy"
  inputs:
    script: |
      set KUBECONFIG=C:\azagent\.kube\config
      kubectl apply -f deployment.yaml
      kubectl apply -f service.yaml
