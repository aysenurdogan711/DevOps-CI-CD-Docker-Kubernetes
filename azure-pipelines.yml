trigger:
- main

pool:
  name: Default   # Azureagent'in olduğu pool

steps:
- script: |
    echo "Docker version:"
    docker version
  displayName: Docker Version Test

- script: |
    docker build -t nginx-test .
  displayName: Docker Build

- script: |
    docker run --rm -p 8080:80 nginx-test
  displayName: Docker Run Test